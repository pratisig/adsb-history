<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>diag</title><body><pre id="out">…</pre>
<script>
const urls = [
  'https://raw.githubusercontent.com/pratisig/adsb-history/live/data/index.json',
  'https://cdn.jsdelivr.net/gh/pratisig/adsb-history@live/data/index.json',
  'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.adsb.lol/v2/point/14.74/-17.49/60'),
];
const out = document.getElementById('out');
(async () => {
  const lines = [];
  for (const u of urls) {
    const t0 = performance.now();
    try {
      const r = await fetch(u, { cache: 'no-store' });
      const text = await r.text();
      lines.push(`${u} -> HTTP ${r.status} en ${Math.round(performance.now() - t0)} ms, ${text.length} octets : ${text.slice(0, 80).replace(/\s+/g, ' ')}`);
    } catch (e) {
      lines.push(`${u} -> ÉCHEC ${Math.round(performance.now() - t0)} ms : ${e && e.message}`);
    }
    out.textContent = lines.join('\n');
  }
  out.textContent = lines.join('\n') + '\nFIN';
})();
</script></body></html>
