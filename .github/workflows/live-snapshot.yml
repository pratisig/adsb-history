name: Relevé ADS-B automatique

# Interroge les API ADS-B publiques depuis un runner GitHub (elles n'autorisent
# pas les appels depuis un navigateur), puis publie le relevé sur la branche
# `live`. Le site le lit ensuite en JSON : données réelles, sans archive, sans clé.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relevé continu et publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 3 passes de 8 min après un push (≈ 24 min de relevé continu), 1 passe sinon
          PASSES: ${{ github.event_name == 'push' && '3' || '1' }}
        run: |
          set -euo pipefail
          publish() {
            rm -rf /tmp/live-publish
            mkdir -p /tmp/live-publish/data
            cp data/*.json /tmp/live-publish/data/
            (
              cd /tmp/live-publish
              git init -q
              git checkout -q --orphan live
              git add -A
              if git diff --cached --quiet; then
                echo "Rien de nouveau à publier."
                exit 0
              fi
              git -c user.name="releve-adsb" -c user.email="actions@users.noreply.github.com" \
                  commit -q -m "relevé $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git push -q --force \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:live
              echo "Publié : $(ls data | tr '\n' ' ')"
            )
          }
          for i in $(seq 1 "${PASSES}"); do
            echo "=== Passe ${i}/${PASSES} ==="
            node docs/tools/live-snapshot.mjs --out=data --seed --loop-minutes=8 --poll-seconds=30
            publish
          done
